name: Apply Python course update
on:
  push:
    paths:
      - scripts/apply_python_course.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Add Python beginner course [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply course patch
        run: python scripts/apply_python_course.py
      - name: Commit final files
        run: |
          rm -f scripts/apply_python_course.py .github/workflows/apply-python-course.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html README.md CHANGES.md scripts/apply_python_course.py .github/workflows/apply-python-course.yml
          git diff --cached --quiet || git commit -m "Add Python beginner course [skip ci]"
          git push

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fluent Panda">
  <title>Fluent Panda</title>
  <defs>
    <!-- Общий градиент в координатах иконки: все части окрашены как единое целое -->
    <linearGradient id="lgPanda" gradientUnits="userSpaceOnUse" x1="-150" y1="150" x2="150" y2="-150">
      <stop offset="0" stop-color="#3A1C71"/>
      <stop offset=".6" stop-color="#7B1FA2"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="lgPages" gradientUnits="userSpaceOnUse" x1="-45" y1="68" x2="45" y2="142">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 250)">
    <!-- Уши -->
    <circle cx="-94" cy="-94" r="46" fill="url(#lgPanda)"/>
    <circle cx="94" cy="-94" r="46" fill="url(#lgPanda)"/>
    <!-- Голова -->
    <circle r="130" fill="#FFFFFF" stroke="url(#lgPanda)" stroke-width="12"/>
    <!-- Пятна вокруг глаз -->
    <ellipse cx="-52" cy="-10" rx="30" ry="38" transform="rotate(38 -52 -10)" fill="url(#lgPanda)"/>
    <ellipse cx="52" cy="-10" rx="30" ry="38" transform="rotate(-38 52 -10)" fill="url(#lgPanda)"/>
    <!-- Прищуренные глаза -->
    <path d="M-66 -8 Q-52 2 -38 -10" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 -8 Q52 2 38 -10" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <!-- Нос и улыбка -->
    <path d="M-15 22 H15 Q17 22 15 25 L3 37 Q0 40 -3 37 L-15 25 Q-17 22 -15 22 Z" fill="url(#lgPanda)"/>
    <path d="M-14 48 Q0 58 14 48" fill="none" stroke="url(#lgPanda)" stroke-width="6" stroke-linecap="round"/>
    <!-- Книга -->
    <g transform="translate(0 108)">
      <path d="M-56 -26 L-4 -38 L-4 28 L-50 42 Z" fill="url(#lgPanda)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <path d="M56 -26 L4 -38 L4 28 L50 42 Z" fill="url(#lgPanda)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-46 -20 L-10 -29 L-10 22 L-42 33 Z" fill="url(#lgPages)"/>
      <path d="M46 -20 L10 -29 L10 22 L42 33 Z" fill="url(#lgPages)"/>
      <path d="M-38 -9 L-18 -14 M-38 3 L-18 -2 M38 -9 L18 -14 M38 3 L18 -2" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Лапки -->
    <ellipse cx="-60" cy="112" rx="20" ry="24" transform="rotate(-20 -60 112)" fill="url(#lgPanda)" stroke="#FFFFFF" stroke-width="5"/>
    <ellipse cx="60" cy="112" rx="20" ry="24" transform="rotate(20 60 112)" fill="url(#lgPanda)" stroke="#FFFFFF" stroke-width="5"/>
  </g>
</svg>
